<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📋 Task Management System</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userEmail"></span>
                <span class="badge" id="userRole"></span>
                <button id="logoutBtn" class="btn-secondary">Log out</button>
            </div>
            <div class="auth-buttons" id="authButtons">
                <button id="loginBtn" class="btn-primary">Login</button>
                <button id="registerBtn" class="btn-secondary">Registration</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="authModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Entrance</h2>
                
                <form id="authForm">
                    <div id="registerFields" style="display: none;">
                        <label>
                            Role:
                            <select id="roleSelect">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </label>
                    </div>
                    
                    <label>
                        Email:
                        <input type="email" id="emailInput" required>
                    </label>
                    
                    <label>
                        Password:
                        <input type="password" id="passwordInput" required minlength="6">
                    </label>
                    
                    <div id="authError" class="error-message"></div>
                    
                    <button type="submit" class="btn-primary btn-block" id="authSubmitBtn">Login</button>
                </form>
            </div>
        </div>

        <section class="card" id="taskFormSection" style="display: none;">
            <h2 id="formTitle">Create task</h2>
            <form id="taskForm">
                <input type="hidden" id="editingId">
                
                <label>
                    Title:
                    <input type="text" id="titleInput" placeholder="Task title" required>
                </label>
                
                <label>
                    Description:
                    <textarea id="descriptionInput" placeholder="Task description" required></textarea>
                </label>
                
                <div class="row">
                    <label>
                        Status:
                        <select id="statusSelect" required>
                            <option value="todo">To do</option>
                            <option value="in_progress">In progress</option>
                            <option value="done">Done</option>
                        </select>
                    </label>
                    
                    <label>
                        Priority:
                        <select id="prioritySelect" required>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                </div>

                <div class="row">
                    <label>
                        Assignee (email):
                        <input type="email" id="assigneeInput" placeholder="user@example.com">
                    </label>

                    <label>
                        Due date:
                        <input type="date" id="dueDateInput">
                    </label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBtn">Create</button>
                    <button type="button" class="btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Tasks</h2>
            <form id="filtersForm" class="filters">
                <input type="text" id="searchInput" placeholder="Search by title or description">
                <select id="filterStatus">
                    <option value="">All statuses</option>
                    <option value="todo">To do</option>
                    <option value="in_progress">In progress</option>
                    <option value="done">Done</option>
                </select>
                <select id="filterPriority">
                    <option value="">All priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <label class="checkbox">
                    <input type="checkbox" id="myTasksOnly">
                    Assigned to me
                </label>
                <div class="filter-actions">
                    <button type="submit" class="btn-primary">Apply</button>
                    <button type="button" class="btn-secondary" id="resetFilters">Reset</button>
                </div>
            </form>
            <div id="tasksList" class="tasks-list"></div>
            <div id="loadingMessage" class="loading">Loading...</div>
            <div id="emptyMessage" class="empty-message" style="display: none;">
                No tasks. <span id="adminHint" style="display: none;">Log in as an administrator to create a task.</span>
            </div>
        </section>
    </main>

    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>
